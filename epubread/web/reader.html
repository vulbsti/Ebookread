<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ebookread</title>
  <link rel="stylesheet" href="reader.css" />
</head>
<body>
  <div id="warm-overlay" aria-hidden="true"></div>
  <div id="foliate-host"></div>
  <aside id="footnote" hidden role="dialog" aria-label="Footnote">
    <div id="footnote-body"></div>
    <div id="footnote-actions">
      <button id="footnote-goto" type="button">Go to note</button>
      <button id="footnote-close" type="button" aria-label="Close">Close</button>
    </div>
  </aside>
  <section id="error" hidden role="alert">
    <h2>Can't open this book</h2>
    <p></p>
  </section>
  <script type="module" src="reader.js"></script>
</body>
</html>
