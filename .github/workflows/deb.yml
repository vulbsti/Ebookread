name: Debian package

on:
  push:
    branches: [main, gtk4-rewrite]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  deb:
    name: Build and install .deb (Ubuntu 24.04)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: build-aux/deb/build-deb.sh
      - name: Install on a clean runner
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ./dist/ebookread_*_all.deb
          /usr/bin/python3 -c "import sys; sys.path.insert(0, '/usr/share/ebookread'); import epubread.ui.window"
      - uses: actions/upload-artifact@v4
        with:
          name: ebookread-deb
          path: dist/ebookread_*_all.deb

  release:
    name: Attach to GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: deb
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ebookread-deb
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" ebookread_*_all.deb --clobber --repo "${GITHUB_REPOSITORY}"
