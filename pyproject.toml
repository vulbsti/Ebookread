[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ebookread"
version = "0.3.0"
description = "A comfortable GTK4 e-book reader for EPUB, MOBI, FB2, comics and PDF"
license = "GPL-3.0-or-later"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
ebookread = "epubread.main:main"

[tool.setuptools.packages.find]
include = ["epubread*"]

[tool.setuptools.package-data]
"epubread.web" = ["*.html", "*.css", "*.js", "foliate-js/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
